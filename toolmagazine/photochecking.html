 *  图片操作
 * ================================================ */
function markAsUnique(filename) {
    const status = state.statusMap.get(filename);
    // 只允许忽略 pending 状态或搜索结果（undefined）
    if (status !== 'pending' && status !== undefined) return;
    state.statusMap.set(filename, 'unique');
    state.selectedFiles.delete(filename);
    saveState();
    renderAll();
}

function moveToPending(filename) {
    for (const [_, group] of state.baseGroups) group.images = group.images.filter(f => f !== filename);
    for (const [gid, group] of [...state.duplicateGroups]) {
        if (group.base === filename) {
            group.duplicates.forEach(f => state.statusMap.set(f, 'pending'));
            state.duplicateGroups.delete(gid);
        } else {
            group.duplicates = group.duplicates.filter(f => f !== filename);
        }
    }
    state.statusMap.set(filename, 'pending');
    state.selectedFiles.delete(filename);
    saveState();
    renderAll();
}

function deleteBaseImage(baseFilename) {
    if (!confirm(`删除基准图「${baseFilename}」会同步删除所有以此图为基准的重复分组，确定继续？`)) return;
    for (const [gid, group] of [...state.duplicateGroups]) {
        if (group.base === baseFilename) {
            group.duplicates.forEach(f => state.statusMap.set(f, 'pending'));
            state.duplicateGroups.delete(gid);
        }
    }
    state.statusMap.set(baseFilename, 'pending');
    for (const [_, g] of state.baseGroups) g.images = g.images.filter(f => f !== baseFilename);
    saveState();
    renderAll();
}

function createNewGroup() {
    const groupName = prompt('请输入新分组名称');
    if (!groupName || !groupName.trim()) {
        alert('分组名称不能为空');
        return;
    }
    const gid = Date.now().toString();
    state.baseGroups.set(gid, { name: groupName.trim(), images: [] });
    saveState();
    renderAll();
}

function startCandidateCheck(filename) {
    state.currentCandidateBase = filename;
    const threshold = parseInt(els.threshold.value);
    const similar = findSimilarByHash(filename, threshold);
    state.candidateList = [filename, ...similar.filter(f => f !== filename)];
    state.selectedCandidate.clear();
    state.candidateStep = 1;
    state.candidateSelectedBase = filename;
    state.candidateSelectedGroup = null;
    showCandidatePanelStep1();
}

function showCandidatePanelStep1() {
    const title = document.getElementById('candidateTitle');
    title.textContent = '🔍 第1步：选择基准图片和分组';
    
    const steps = document.querySelectorAll('#candidateSteps .step');
    steps[0].classList.add('active');
    steps[0].classList.remove('done');
    steps[1].classList.remove('active', 'done');
    
    els.candidateList.innerHTML = '';
    
    let groupSelect = document.getElementById('baseGroupSelect');
    if (!groupSelect) {
        groupSelect = document.createElement('div');
        groupSelect.id = 'baseGroupSelect';
        groupSelect.className = 'base-group-select';
        
        const label = document.createElement('div');
        label.style.cssText = 'font-size:11px;color:var(--text-muted);margin-bottom:2px;';
        label.textContent = '选择基准组：';
        
        const dropdown = document.createElement('select');
        dropdown.id = 'baseGroupDropdown';
        
        const newBtn = document.createElement('button');
        newBtn.id = 'createNewGroup';
        newBtn.className = 'btn-new-group';
        newBtn.textContent = '+ 新建分组';
        newBtn.addEventListener('click', () => {
            const groupName = prompt('请输入新分组名称：', `基准组_${new Date().toLocaleTimeString()}`);
            if (!groupName) return;
            const gid = Date.now().toString();
            state.baseGroups.set(gid, { name: groupName.trim(), images: [] });
            state.candidateSelectedGroup = gid;
            updateGroupDropdown();
        });
        
        groupSelect.appendChild(label);
        groupSelect.appendChild(dropdown);
        groupSelect.appendChild(newBtn);
        
        const listEl = els.candidateList;
        listEl.parentNode.insertBefore(groupSelect, listEl);
        
        dropdown.addEventListener('change', () => {
            state.candidateSelectedGroup = dropdown.value || null;
        });
    }
    
    groupSelect.style.display = 'flex';
    updateGroupDropdown();
    
    els.candidateList.innerHTML = '';
    const baseFilename = state.currentCandidateBase;
    
    for (let i = 0; i < state.candidateList.length; i++) {
        const filename = state.candidateList[i];
        const item = document.createElement('div');
        item.className = 'candidate-item' + (filename === baseFilename ? ' current' : '');
        
        const isSelected = state.candidateSelectedBase === filename;
        const isFirst = i === 0;
        
        const cached = thumbCache.get(filename);
        item.innerHTML = `
            <input type="radio" name="baseImg" data-fn="${filename}" ${isSelected ? 'checked' : ''}>
            <img class="thumb" data-filename="${filename}" ${cached ? `src="${cached}"` : ''} alt="">
            <div class="fname">${filename}${isFirst ? ' <span style="color:var(--accent)">(你选的)</span>' : ''}</div>
        `;
        
        const radio = item.querySelector('input');
        radio.addEventListener('change', () => {
            if (radio.checked) {
                state.candidateSelectedBase = filename;
            }
        });
        
        // 点击整个区域选中
        item.addEventListener('click', (e) => {
            if (e.target.classList.contains('thumb')) return; // 缩略图点击走预览
            radio.checked = true;
            state.candidateSelectedBase = filename;
            // 更新高亮
            els.candidateList.querySelectorAll('.candidate-item').forEach(el => el.classList.remove('current'));
            item.classList.add('current');
        });
        
        // 点击缩略图预览
        const thumb = item.querySelector('.thumb');
        thumb.addEventListener('click', (e) => {
            e.stopPropagation();
            previewImage(filename);
        });
        
        if (!cached) lazyObserver.observe(thumb);
        els.candidateList.appendChild(item);
    }
    
    els.candidateConfirm.textContent = '下一步：选择重复图';
    els.candidateConfirm.disabled = false;
    els.candidatePanel.classList.add('show');
}

function updateGroupDropdown() {
    const dropdown = document.getElementById('baseGroupDropdown');
    dropdown.innerHTML = '';
    
    const existingGroups = [...state.baseGroups.entries()];
    const selectedGid = state.candidateSelectedGroup;
    
    if (existingGroups.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '（暂无分组，点击+新建）';
        dropdown.appendChild(opt);
    } else {
        for (const [gid, group] of existingGroups) {
            const opt = document.createElement('option');
            opt.value = gid;
            opt.textContent = group.name;
            if (gid === selectedGid) opt.selected = true;
            dropdown.appendChild(opt);
        }
    }
}

function showCandidatePanelStep2() {
    const title = document.getElementById('candidateTitle');
    title.textContent = '🔍 第2步：选择重复图片（可多选）';
    
    const steps = document.querySelectorAll('#candidateSteps .step');
    steps[0].classList.add('done');
    steps[0].classList.remove('active');
    steps[1].classList.add('active');
    steps[1].classList.remove('done');
    
    const groupSelect = document.getElementById('baseGroupSelect');
    if (groupSelect) groupSelect.style.display = 'none';
    
    els.candidateList.innerHTML = '';
    const baseFilename = state.candidateSelectedBase;
    const remaining = state.candidateList.filter(f => f !== baseFilename);
    
    if (remaining.length === 0) {
        const item = document.createElement('div');
        item.style.cssText = 'padding:30px;text-align:center;color:var(--text-muted);';
        item.textContent = '没有找到相似图片，点击完成直接创建基准组';
        els.candidateList.appendChild(item);
    }
    
    for (const filename of remaining) {
        const item = document.createElement('div');
        item.className = 'candidate-item';
        
        const isSelected = state.selectedCandidate.has(filename);
        const cached = thumbCache.get(filename);
        item.innerHTML = `
            <input type="checkbox" data-fn="${filename}" ${isSelected ? 'checked' : ''}>
            <img class="thumb" data-filename="${filename}" ${cached ? `src="${cached}"` : ''} alt="">
            <div class="fname">${filename}</div>
        `;
        
        const checkbox = item.querySelector('input');
        checkbox.addEventListener('change', () => {
            if (checkbox.checked) state.selectedCandidate.add(filename);
            else state.selectedCandidate.delete(filename);
        });
        
        if (!cached) lazyObserver.observe(item.querySelector('.thumb'));
        els.candidateList.appendChild(item);
    }
    
    els.candidateConfirm.textContent = '完成归类';
    els.candidateConfirm.disabled = false;
}

function hideCandidatePanel() {
    els.candidatePanel.classList.remove('show');
    
    const groupSelect = document.getElementById('baseGroupSelect');
    if (groupSelect) groupSelect.style.display = 'flex';
    
    state.currentCandidateBase = null;
    state.candidateList = [];
    state.selectedCandidate.clear();
    state.candidateStep = 1;
    state.candidateSelectedBase = null;
    state.candidateSelectedGroup = null;
}

function confirmCandidate() {
    if (state.candidateStep === 1) {
        if (!state.candidateSelectedBase) {
            alert('请选择一张图片作为基准图');
            return;
        }
        
        const dropdown = document.getElementById('baseGroupDropdown');
        state.candidateSelectedGroup = dropdown.value || null;
        
        state.candidateStep = 2;
        showCandidatePanelStep2();
        return;
    }
    
    if (state.candidateStep === 2) {
        const baseFile = state.candidateSelectedBase;
        const groupGid = state.candidateSelectedGroup;
        const dupFiles = [...state.selectedCandidate];
        
        if (groupGid) {
            const group = state.baseGroups.get(groupGid);
            if (group) {
                group.images.push(baseFile);
            }
        } else {
            const groupName = prompt('请输入基准组名称：', `基准组_${baseFile.substring(0, 10)}`);
            if (!groupName) {
                hideCandidatePanel();
                return;
            }
            const gid = Date.now().toString();
            state.baseGroups.set(gid, { name: groupName.trim(), images: [baseFile] });
        }
        
        state.statusMap.set(baseFile, 'base');
        
        if (dupFiles.length > 0) {
            const dupGid = Date.now().toString();
            state.duplicateGroups.set(dupGid, { base: baseFile, duplicates: dupFiles });
            dupFiles.forEach(f => state.statusMap.set(f, 'duplicate'));
        }
        
        hideCandidatePanel();
        saveState();
        renderAll();
    }
}

/* ================================================
 *  搜索系统
 * ================================================ */
function setSearchMode(mode) {
    state.searchMode = mode;
    document.querySelectorAll('.search-mode button').forEach(b => b.classList.remove('active'));
    const map = { fuzzy: 'modeFuzzy', hash: 'modeHash', ocr: 'modeOcr' };
    document.getElementById(map[mode]).classList.add('active');
    
    const placeholders = {
        fuzzy: '输入文件名关键词...',
        hash: '输入文件名或 "file:xxx" 查找相似图...',
        ocr: '输入图片内文字内容...'
    };
    els.searchInput.placeholder = placeholders[mode];
}

async function performSearch() {
    const query = els.searchInput.value.trim();
    if (!query) return;
    
    if (state.isSearching) {
        state.abortSearch = true;
        return;
    }
    
    state.abortSearch = false;
    state.isSearching = true;
    
    showProgress('🔍 搜索中...', 0, '准备中...');
    
    try {
        if (state.searchMode === 'fuzzy') {
            performFuzzySearch(query);
        } else if (state.searchMode === 'hash') {
            await performHashSearch(query);
        } else {
            await performOcrSearch(query);
        }
    } catch (e) {
        console.error('搜索失败:', e);
        alert('搜索失败: ' + e.message);
    }
    
    state.isSearching = false;
    state.abortSearch = false;
    hideProgress();
    
    if (state.searchResults.length > 0) {
        state.currentTab = 'search';
        document.querySelector('[data-tab="search"]').style.display = '';
    } else {
        if (state.searchMode === 'ocr') {
            alert('未找到匹配的图片');
        }
        state.currentTab = 'pending';
        document.querySelector('[data-tab="search"]').style.display = 'none';
    }
    updateTabUI();
    renderContent();
    updateCounts();
}

function performFuzzySearch(query) {
    const pendingFiles = getFilesByStatus('pending');
    const results = [];
    const lowerQuery = query.toLowerCase();
    
    for (const filename of pendingFiles) {
        if (state.abortSearch) break;
        if (filename.toLowerCase().includes(lowerQuery)) {
            results.push(filename);
        }
    }
    
    state.searchResults = results;
}

async function performHashSearch(query) {
    const pendingFiles = getFilesByStatus('pending');
    const threshold = parseInt(els.threshold.value);
    const results = [];
    
    showProgress('🎨 准备视觉特征...', 0, '提取特征中...');
    
    await computeAllVisualFeatures();
    
    if (state.abortSearch) {
        state.searchResults = [];
        return;
    }
    
    if (query.startsWith('file:')) {
        const targetFile = query.slice(5).trim();
        if (state.imageFeatureMap.has(targetFile)) {
            const similar = findSimilarByVisual(targetFile, threshold);
            results.push(targetFile, ...similar);
        } else if (state.imageHashMap.has(targetFile)) {
            const similar = findSimilarByHash(targetFile, threshold);
            results.push(targetFile, ...similar);
        } else {
            alert('未找到该文件的记录');
            return;
        }
    } else {
        const lowerQuery = query.toLowerCase();
        for (const filename of pendingFiles) {
            if (state.abortSearch) break;
            if (filename.toLowerCase().includes(lowerQuery)) {
                results.push(filename);
            }
        }
        
        showProgress('🎨 视觉搜索中...', 0, '使用多级特征计算相似度...');
        
        const featureFiles = pendingFiles.filter(f => state.imageFeatureMap.has(f));
        let processed = 0;
        
        for (const baseFile of featureFiles) {
            if (state.abortSearch) break;
            const similar = findSimilarByVisual(baseFile, threshold);
            for (const f of similar) {
                if (!results.includes(f)) results.push(f);
            }
            processed++;
            showProgress('🎨 视觉搜索中...', Math.round(processed / featureFiles.length * 100), `${results.length} 张已找到`);
        }
        
        const hashOnlyFiles = pendingFiles.filter(f => !state.imageFeatureMap.has(f));
        for (const baseFile of hashOnlyFiles) {
            if (state.abortSearch) break;
            const hash = state.imageHashMap.get(baseFile);
            if (!hash) continue;
            const similar = findSimilarByHash(baseFile, threshold);
            for (const f of similar) {
                if (!results.includes(f)) results.push(f);
            }
        }
    }
    
    state.searchResults = results;
}

async function performOcrSearch(query) {
    const pendingFiles = getFilesByStatus('pending');
    const results = [];
    const uncachedFiles = [];
    const lowerQuery = query.toLowerCase();
    
    for (const filename of pendingFiles) {
        if (state.ocrTextMap.has(filename) && state.ocrTextMap.get(filename)) {
            if (state.ocrTextMap.get(filename).toLowerCase().includes(lowerQuery)) {
                results.push(filename);
            }
        } else {
            uncachedFiles.push(filename);
        }
    }
    
    if (uncachedFiles.length === 0) {
        buildInvertedIndex();
        const indexedResults = searchOcrIndex(query);
        if (indexedResults.length > 0) {
            const scoredResults = indexedResults.filter(f => pendingFiles.includes(f));
            if (scoredResults.length > results.length) {
                state.searchResults = scoredResults;
            } else {
                state.searchResults = results;
            }
        } else {
            state.searchResults = results;
        }
        return;
    }
    
    showProgress('⏳ 初始化 OCR...', 0, '加载识别引擎...');
    
    const worker = await initOcrWorker();
    if (!worker) {
        alert('OCR 引擎初始化失败，请检查网络连接');
        buildInvertedIndex();
        const indexedResults = searchOcrIndex(query);
        const finalResults = [...new Set([...results, ...indexedResults.filter(f => pendingFiles.includes(f))])];
        state.searchResults = finalResults;
        return;
    }
    
    showProgress('📝 OCR 识别中...', 0, `0 / ${uncachedFiles.length}`);
    
    let processedCount = 0;
    
    for (let i = 0; i < uncachedFiles.length && !state.abortSearch; i += CONFIG.MAX_OCR_CONCURRENT) {
        const batch = uncachedFiles.slice(i, Math.min(i + CONFIG.MAX_OCR_CONCURRENT, uncachedFiles.length));
        
        const ocrPromises = batch.map(async (filename) => {
            if (state.abortSearch) return null;
            try {
                const entry = state.entryMap.get(filename);
                if (!entry) return null;
                const blob = await entry.getData(new BlobWriter());
                if (state.abortSearch) return null;
                const processedBlob = await preprocessForOcr(blob);
                if (state.abortSearch) return null;
                const { data: { text: ocrText } } = await worker.recognize(processedBlob || blob);
                const text = (ocrText || '').trim();
                state.ocrTextMap.set(filename, text);
                return { filename, text };
            } catch (e) {
                state.ocrTextMap.set(filename, '');
                return null;
            }
        });
        
        const batchResults = await Promise.all(ocrPromises);
        
        for (const result of batchResults) {
            if (state.abortSearch) break;
            if (result && result.text && result.text.toLowerCase().includes(lowerQuery)) {
                results.push(result.filename);
            }
            processedCount++;
            showProgress('📝 OCR 识别中...', Math.round(processedCount / uncachedFiles.length * 100), `${processedCount} / ${uncachedFiles.length}`);
        }
    }
    
    buildInvertedIndex();
    const indexedResults = searchOcrIndex(query);
    const finalResults = [...new Set([...results, ...indexedResults.filter(f => pendingFiles.includes(f))])];
    
    state.searchResults = finalResults;
    await saveState();
}

let currentContextTarget = null;
let currentContextArea = null;

function showContextMenu(e, filename, area) {

    currentContextArea = area;
    
    const items = els.contextMenu.querySelectorAll('.context-item');
    items.forEach(item => {

    });

    currentContextArea = null;

    if (action === 'check') startCandidateCheck(currentContextTarget);
    else if (action === 'ignore') markAsUnique(currentContextTarget);
    else if (action === 'restore') moveToPending(currentContextTarget);
    else if (action === 'delBase') deleteBaseImage(currentContextTarget);
    hideContextMenu();
}

/* ================================================
 *  拖拽系统
 * ================================================ */
function setupDragAndDrop() {
    // 全局微信式多选拖拽：mousemove + mouseup（只绑定一次）
    document.addEventListener('mousemove', (e) => {
        if (!state.multiSelectDragging) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const targetCard = el ? el.closest('.image-card') : null;
        if (targetCard && targetCard.dataset.filename) {
            const fn = targetCard.dataset.filename;
            if (!state.selectedFiles.has(fn)) {
                toggleFileSelection(fn);
                els.multiDragCount.textContent = `已选 ${state.selectedFiles.size} 张`;
            }
        }
    });
    
    document.addEventListener('mouseup', () => {
        if (state.multiSelectDragTimer) { clearTimeout(state.multiSelectDragTimer); state.multiSelectDragTimer = null; }
        if (state.multiSelectDragging) {
            state.multiSelectDragging = false;
            state.multiSelectDragInitiator = null;
            els.multiDragIndicator.classList.remove('show');
        }
    });
    
    // 拖出浏览器窗口时隐藏悬浮窗
    document.addEventListener('dragleave', (e) => {
        if (e.relatedTarget === null) {
            hideBaseFloatWindow();
        }
    });
    
    document.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (state.dragSource) {
            e.dataTransfer.dropEffect = 'move';
        }
    });
    
    els.contentArea.addEventListener('dragover', (e) => {
        if (state.dragSource) {
            e.preventDefault();
            e.stopPropagation();
            const card = e.target.closest('.image-card');
            document.querySelectorAll('.image-card.drop-target').forEach(el => el.classList.remove('drop-target'));
            if (card && card.dataset.filename !== state.dragSource) {
                card.classList.add('drop-target');
            }
        }
    });
    
    els.contentArea.addEventListener('dragleave', (e) => {
        if (!els.contentArea.contains(e.relatedTarget)) {
            document.querySelectorAll('.image-card.drop-target').forEach(el => el.classList.remove('drop-target'));
        }
    });
    
    els.contentArea.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!state.dragSource) return;
        
        const targetCard = e.target.closest('.image-card');
        const targetFolder = e.target.closest('.folder-group');
        
        document.querySelectorAll('.image-card.drop-target').forEach(el => el.classList.remove('drop-target'));
        
        if (targetCard && targetCard.dataset.filename !== state.dragSource) {
            handleDropOnImage(state.dragSource, targetCard.dataset.filename);
        } else if (targetFolder) {
            handleDropOnFolder(state.dragSource, targetFolder.dataset.groupId);
        }
    });
    
    els.dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        els.dropzone.classList.add('drag-over');
    });
    
    els.dropzone.addEventListener('dragleave', () => {
        els.dropzone.classList.remove('drag-over');
    });
    
    els.dropzone.addEventListener('drop', async (e) => {
        e.preventDefault();
        els.dropzone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.zip')) {
            await startPreprocessing(file);
        } else {
            alert('请拖入 .zip 压缩包文件');
        }
    });
}

function handleDropOnImage(sourceFilename, targetFilename) {
    const targetHash = state.imageHashMap.get(targetFilename);
    if (!targetHash) {
        alert('目标图片哈希尚未计算');
        return;
    }
    const threshold = parseInt(els.threshold.value);
    const sourceHash = state.imageHashMap.get(sourceFilename);
    if (!sourceHash) {
        alert('源图片哈希尚未计算');
        return;
    }
    
    const targetStatus = state.statusMap.get(targetFilename);
    const sourceStatus = state.statusMap.get(sourceFilename);
    if (targetStatus === 'ignored' || sourceStatus === 'ignored') {
        alert('已忽略的图片不能参与查重');
        return;
    }
    
    const dist = hammingDistance(sourceHash, targetHash);
    if (dist <= threshold) {
        let actionMsg = `相似度: ${dist} (阈值: ${threshold})\n\n`;
        if (targetStatus === 'base') {
            actionMsg += `「${targetFilename}」已是基准图，`;
        } else if (targetStatus === 'duplicate') {
            actionMsg += `「${targetFilename}」已是重复图，`;
        }
        actionMsg += `是否将「${sourceFilename}」标记为「${targetFilename}」的重复图片？\n\n确定后可在重复组查看。`;
        
        const action = confirm(actionMsg);
        if (action) {
            state.statusMap.set(targetFilename, 'base');
            state.statusMap.set(sourceFilename, 'duplicate');
            
            let gid = null;
            for (const [id, g] of state.duplicateGroups) {
                if (g.base === targetFilename) { gid = id; break; }
            }
            if (!gid) {
                gid = Date.now().toString();
                state.duplicateGroups.set(gid, { base: targetFilename, duplicates: [] });
            }
            state.duplicateGroups.get(gid).duplicates.push(sourceFilename);
            saveState();
            renderAll();
        }
    } else {
        alert(`相似度: ${dist} (阈值: ${threshold})\n\n这两张图片可能不相似，建议使用右键"查重图片"功能进行确认。`);
    }
}

function handleDropOnFolder(filename, groupId) {
    const group = state.baseGroups.get(groupId);
    if (!group) {
        alert('分组不存在');
        return;
    }
    for (const [_, g] of state.baseGroups) g.images = g.images.filter(f => f !== filename);
    for (const [_, g] of state.duplicateGroups) g.duplicates = g.duplicates.filter(f => f !== filename);
    state.statusMap.set(filename, 'base');
    if (!group.images.includes(filename)) {
        group.images.push(filename);
    }
    saveState();
    renderAll();
}

/* ================================================
 *  基准组悬浮窗（拖拽时显示）
 * ================================================ */
function showBaseFloatWindow() {
    if (state.baseGroups.size === 0) return;
    renderBaseFloatList();
    els.baseFloatWindow.classList.add('show');
}

function hideBaseFloatWindow() {
    els.baseFloatWindow.classList.remove('show');
    stopBaseFloatAutoScroll();
}

function renderBaseFloatList() {
    els.baseFloatList.innerHTML = '';
    for (const [gid, group] of state.baseGroups) {
        for (const imgFile of group.images) {
            const item = document.createElement('div');
            item.className = 'base-float-item';
            item.dataset.filename = imgFile;
            item.dataset.groupId = gid;
            
            const cached = thumbCache.get(imgFile);
            item.innerHTML = `
                <img class="thumb" data-filename="${imgFile}" ${cached ? `src="${cached}"` : ''} alt="">
                <div class="fname">${imgFile}</div>
            `;
            
            if (!cached) {
                const thumb = item.querySelector('.thumb');
                loadThumbnail(imgFile).then(url => {
                    if (url && thumb.dataset.filename === imgFile && !thumb.src) {
                        thumb.src = url;
                    }
                });
            }
            
            // 拖放高亮
            item.addEventListener('dragover', (e) => {
                if (!state.dragSource) return;
                e.preventDefault();
                e.stopPropagation();
                document.querySelectorAll('.base-float-item.drop-hover').forEach(el => el.classList.remove('drop-hover'));
                item.classList.add('drop-hover');
            });
            
            item.addEventListener('dragleave', () => {
                item.classList.remove('drop-hover');
            });
            
            item.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                item.classList.remove('drop-hover');
                if (!state.dragSource) return;
                const sourceFilename = state.dragSource;
                const targetFilename = imgFile;
                const targetGid = gid;
                
                // 校验状态：不允许将基准图或重复图再次归类
                const sourceStatus = state.statusMap.get(sourceFilename);
                if (sourceStatus === 'base' || sourceStatus === 'duplicate') {
                    alert('源图片已是基准图或重复图，无法再次归类');
                    return;
                }
                
                // 将源图片标记为目标图片的重复图
                let dupGid = null;
                for (const [id, g] of state.duplicateGroups) {
                    if (g.base === targetFilename) { dupGid = id; break; }
                }
                if (!dupGid) {
                    dupGid = Date.now().toString();
                    state.duplicateGroups.set(dupGid, { base: targetFilename, duplicates: [] });
                }
                const dupGroup = state.duplicateGroups.get(dupGid);
                if (!dupGroup.duplicates.includes(sourceFilename)) {
                    dupGroup.duplicates.push(sourceFilename);
                }
                
                // 更新状态
                state.statusMap.set(targetFilename, 'base');
                state.statusMap.set(sourceFilename, 'duplicate');
                
                // 从原位置移除
                for (const [_, g] of state.baseGroups) g.images = g.images.filter(f => f !== sourceFilename);
                for (const [_, g] of state.duplicateGroups) {
                    if (g.base !== targetFilename) {
                        g.duplicates = g.duplicates.filter(f => f !== sourceFilename);
                    }
                }
                
                saveState();
                renderAll();
                hideBaseFloatWindow();
            });
            
            els.baseFloatList.appendChild(item);
        }
    }
}

/* ================================================
 *  预处理
 * ================================================ */
let totalImagesCount = 0;

function updateProgressUI() {
    if (totalImagesCount > 0) {
        const pct = (processedCount / totalImagesCount) * 100;
        const memInfo = (performance.memory ? `内存: ${(performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(0)}MB | ` : '');
        const speed = processedCount > 0 ? `${(processedCount / ((Date.now() - preprocessStartTime) / 1000)).toFixed(1)}/s` : '-';
        showProgress('⏳ 预处理中...', pct, `${memInfo}${processedCount} / ${totalImagesCount} | ${speed}`);
    }
}

let preprocessStartTime = 0;

let progressRefreshTimer = null;
function startProgressRefresh() {
    if (progressRefreshTimer) return;
    progressRefreshTimer = setInterval(() => {
        updateProgressUI();
        if (!state.isProcessing) {
            clearInterval(progressRefreshTimer);
            progressRefreshTimer = null;
        }
    }, 500);
}

function stopProgressRefresh() {
    if (progressRefreshTimer) {
        clearInterval(progressRefreshTimer);
        progressRefreshTimer = null;
    }
}

async function startPreprocessing(file) {
    if (state.isProcessing) return;
    state.isProcessing = true;
    state.abortSearch = false;
    preprocessStartTime = Date.now();
    
    try {
        if (state.zipReader && file.name === state.zipFileName && file.size === state.zipFileSize && state.entries.length > 0) {
            await loadState();
            if (state.imageHashMap.size > 0) {
                onPreprocessingDone();
                return;
            }
        }
        
        if (state.zipReader) { try { await state.zipReader.close(); } catch(e) {} state.zipReader = null; }
        destroyAllWorkers();
        clearThumbCache();
        state.imageHashMap.clear();
        state.ocrTextMap.clear();
        state.statusMap.clear();
        state.duplicateGroups.clear();
        state.baseGroups.clear();
        state.entryMap.clear();
        state.entries = [];
        state.zipFileName = file.name;
        state.zipFileSize = file.size;
        processedCount = 0;
        
        els.dropzone.style.display = 'none';
        els.contentArea.style.display = 'none';
        showProgress('⏳ 读取压缩包...', 0, '正在解压...');
        
        state.zipReader = new ZipReader(new BlobReader(file));
        const allEntries = await state.zipReader.getEntries();
        state.entries = allEntries.filter(e => !e.directory && /\.(jpg|jpeg|png|webp|bmp|gif|tiff?)$/i.test(e.filename));
        state.entryMap.clear();
        state.entries.forEach(en => state.entryMap.set(en.filename, en));
        
        totalImagesCount = state.entries.length;
        processedCount = 0;
        
        if (totalImagesCount === 0) throw new Error('压缩包内未找到图片文件');
        
        showProgress('⏳ 预处理中（计算哈希）...', 0, `共 ${totalImagesCount} 张图片`);
        
        for (const e of state.entries) {
            state.statusMap.set(e.filename, 'pending');
        }
        
        const meta = await getDBMeta();
        if (meta && meta.fileName === file.name && meta.fileSize === file.size) {
            await loadState();
            if (state.imageHashMap.size >= totalImagesCount) {
                hideProgress();
                onPreprocessingDone();
                return;
            }
        }
        
        destroyAllWorkers();
        startProgressRefresh();
        
        const CONCURRENT = 16;
        let currentIdx = 0;
        
        function createHashCanvas() {
            const c = document.createElement('canvas');
            c.width = 9;
            c.height = 8;
            return c.getContext('2d', { willReadFrequently: true });
        }
        
        function computePHash(ctx, img) {
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, 0, 0, 9, 8);
            const d = ctx.getImageData(0, 0, 9, 8).data;
            let h = 0n;
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    const i = (y * 9 + x) * 4;
                    const j = i + 4;
                    const g = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                    const g2 = d[j] * 0.299 + d[j+1] * 0.587 + d[j+2] * 0.114;
                    h <<= 1n;
                    if (g > g2) h |= 1n;
                }
            }
            return h.toString(16).padStart(16, '0');
        }
        
        async function processOne() {
            const ctx = createHashCanvas();
            
            while (currentIdx < totalImagesCount && !state.abortSearch) {
                const idx = currentIdx++;
                const entry = state.entries[idx];
                const filename = entry.filename;
                
                try {
                    const blob = await entry.getData(new BlobWriter());
                    const url = URL.createObjectURL(blob);
                    
                    const img = new Image();
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = url;
                    });
                    
                    const hash = computePHash(ctx, img);
                    state.imageHashMap.set(filename, hash);
                    URL.revokeObjectURL(url);
                } catch (e) {
                }
                
                processedCount++;
            }
        }
        
        const workers = [];
        for (let i = 0; i < CONCURRENT; i++) {
            workers.push(processOne());
        }
        
        await Promise.all(workers);
        stopProgressRefresh();
        
        if (state.abortSearch) {
            destroyAllWorkers();
            state.isProcessing = false;
            hideProgress();
            if (state.zipReader) { try { await state.zipReader.close(); } catch(e) {} state.zipReader = null; }
            state.entries = [];
            state.entryMap.clear();
            state.imageHashMap.clear();
            state.statusMap.clear();
            state.ocrTextMap.clear();
            state.imageFeatureMap.clear();
            state.invertedIndex.clear();
            clearThumbCache();
            els.dropzone.style.display = 'flex';
            alert('已取消预处理');
            return;
        }
        
        await saveState();
        hideProgress();
        onPreprocessingDone();
    } catch (err) {
        console.error(err);
        alert('预处理失败: ' + err.message);
        if (state.zipReader) { try { await state.zipReader.close(); } catch(e) {} state.zipReader = null; }
        state.entries = [];
        state.entryMap.clear();
        clearThumbCache();
        els.dropzone.style.display = 'flex';
        hideProgress();
    } finally {
        state.isProcessing = false;
        state.abortSearch = false;
    }
}

function getDBMeta() {
    return new Promise(async (resolve) => {
        try {
            const db = await openDB();
            const tx = db.transaction(STORE_NAME, 'readonly');
            const meta = await promisifyRequest(tx.objectStore(STORE_NAME).get('__meta__'));
            await new Promise(r => { tx.oncomplete = () => { db.close(); r(); }; });
            resolve(meta || { fileName: '', fileSize: 0 });
        } catch (e) {
            resolve({ fileName: '', fileSize: 0 });
        }
    });
}

function onPreprocessingDone() {
    els.dropzone.style.display = 'none';
    els.contentArea.style.display = 'block';
    els.exportBtn.disabled = false;
    els.exportProgressBtn.disabled = false;
    els.resetBtn.disabled = false;
    els.openZipBtn.textContent = '📁 更换压缩包';
    document.querySelector('[data-tab="search"]').style.display = 'none';
    renderAll();
}

/* ================================================
 * 导出 / 导入
 * ================================================ */
async function exportGroupsAsZip() {
    if (state.baseGroups.size === 0) {
        alert('无分组可导出');
        return;
    }
    const zip = new ZipWriter();
    for (const [_, group] of state.baseGroups) {
        const folder = zip.folder(group.name);
        for (const fname of group.images) {
            const entry = state.entryMap.get(fname);
            if (entry) {
                const blob = await entry.getData(new BlobWriter());
                folder.file(fname, blob);
            }
        }
    }
    const content = await zip.close();
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'grouped_images.zip';
    a.click();
    URL.revokeObjectURL(url);
}

async function exportProgress() {
    const data = {
        version: CONFIG.TOOL_VERSION,
        zipFileName: state.zipFileName,
        zipFileSize: state.zipFileSize,
        images: [...state.imageHashMap].map(([filename, hash]) => ({
            filename, hash,
            status: state.statusMap.get(filename) || 'pending',
            ocrText: state.ocrTextMap.get(filename) || ''
        })),
        dupGroups: [...state.duplicateGroups],
        baseGroups: [...state.baseGroups]
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'image_check_progress.json';
    a.click();
    URL.revokeObjectURL(url);
}

async function importProgress() {
    const file = els.importFile.files[0];
    if (!file) return;
    if (!confirm('导入进度将覆盖当前所有状态，确定继续吗？')) {
        els.importFile.value = '';
        return;
    }
    if (state.isProcessing) return;
    state.isProcessing = true;
    
    try {
        const text = await file.text();
        const data = JSON.parse(text);
        
        state.imageHashMap = new Map(data.images.map(i => [i.filename, i.hash]));
        state.statusMap = new Map(data.images.map(i => [i.filename, i.status]));
        state.ocrTextMap = new Map((data.images || []).filter(i => i.ocrText).map(i => [i.filename, i.ocrText]));
        state.duplicateGroups = new Map(data.dupGroups);
        state.baseGroups = new Map(data.baseGroups);
        if (data.zipFileName) state.zipFileName = data.zipFileName;
        if (data.zipFileSize) state.zipFileSize = data.zipFileSize;
        clearThumbCache();
        
        await saveState();
        alert('进度导入成功');
        if (state.entries.length > 0) {
            onPreprocessingDone();
        } else {
            alert('进度已导入，请先加载对应的压缩包以使用完整功能。');
        }
    } catch (err) {
        alert('导入失败: ' + err.message);
    } finally {
        state.isProcessing = false;
        els.importFile.value = '';
    }
}

async function resetWorkProgress() {
    if (state.isProcessing) return;
    if (!confirm('确定要重置当前工作进度吗？所有分组、处理状态都会被清空，且无法恢复。')) return;
    state.isProcessing = true;
    
    try {
        destroyAllWorkers();
        hideCandidatePanel();
        hideContextMenu();
        if (state.zipReader) { try { await state.zipReader.close(); } catch(e) {} state.zipReader = null; }
        
        state.entries = [];
        state.entryMap.clear();
        state.imageHashMap.clear();
        state.ocrTextMap.clear();
        state.statusMap.clear();
        state.duplicateGroups.clear();
        state.baseGroups.clear();
        state.currentCandidateBase = null;
        state.candidateList = [];
        state.selectedCandidate.clear();
        state.zipFileName = '';
        state.zipFileSize = 0;
        totalImagesCount = 0;
        processedCount = 0;
        clearThumbCache();
        
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        await promisifyRequest(tx.objectStore(STORE_NAME).clear());
        await new Promise(r => { tx.oncomplete = () => { db.close(); r(); }; });
        
        els.contentArea.style.display = 'none';
        els.dropzone.style.display = 'flex';
        hideProgress();
        els.exportBtn.disabled = true;
        els.exportProgressBtn.disabled = true;
        els.resetBtn.disabled = true;
        els.openZipBtn.textContent = '📁 打开压缩包';
        els.fileInput.value = '';
        document.querySelector('[data-tab="search"]').style.display = 'none';
    } finally {
        state.isProcessing = false;
    }
}

/* ================================================
 *  渲染入口
 * ================================================ */
function updateTabUI() {
    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === state.currentTab);
    });
}

function renderAll() {
    updateCounts();
    updateTabUI();
    renderContent();
}

/* ================================================
 *  事件绑定
 * ================================================ */
function bindEvents() {
    initElements();
    setupDragAndDrop();
    setupBaseFloatScroll();
    
    els.fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) await startPreprocessing(file);
        e.target.value = '';
    });
    
    els.openZipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const fileInput = document.getElementById('fileInput');
        if (!fileInput) {
            alert('文件输入框未找到，请刷新页面重试');
            return;
        }
        try {
            fileInput.click();
        } catch (err) {
            console.error('打开文件选择框失败:', err);
            alert('打开文件选择框失败，请刷新页面重试');
        }
    });
    
    els.exportBtn.addEventListener('click', exportGroupsAsZip);
    els.exportProgressBtn.addEventListener('click', exportProgress);
    els.resetBtn.addEventListener('click', resetWorkProgress);
    els.importBtn.addEventListener('click', () => {
        els.importFile.click();
    });
    els.importFile.addEventListener('change', importProgress);
    
    document.querySelectorAll('.tab[data-tab]').forEach(tab => {
        tab.addEventListener('click', () => {
            if (tab.dataset.tab === 'search' && state.searchResults.length === 0) return;
            state.currentTab = tab.dataset.tab;
            state.selectedFiles.clear();
            updateBatchBar();
            renderAll();
        });
    });
    
    els.multiSelectBtn.addEventListener('click', toggleMultiSelect);
    els.batchCancelBtn.addEventListener('click', () => {
        state.selectedFiles.clear();
        updateBatchBar();
    });
    els.batchIgnoreBtn.addEventListener('click', () => {
        state.selectedFiles.forEach(f => markAsUnique(f));
        state.selectedFiles.clear();
        updateBatchBar();
    });
    els.batchRestoreBtn.addEventListener('click', () => {
        state.selectedFiles.forEach(f => moveToPending(f));
        state.selectedFiles.clear();
        updateBatchBar();
    });
    els.batchCheckBtn.addEventListener('click', () => {
        if (state.selectedFiles.size > 0) {
            startCandidateCheck(state.selectedFiles.values().next().value);
        }
    });
    
    els.addGroupBtn.addEventListener('click', createNewGroup);
    
    document.getElementById('modeFuzzy').addEventListener('click', () => setSearchMode('fuzzy'));
    document.getElementById('modeHash').addEventListener('click', () => setSearchMode('hash'));
    document.getElementById('modeOcr').addEventListener('click', () => setSearchMode('ocr'));
    
    els.searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            performSearch();
        }
    });
    
    els.threshold.addEventListener('input', () => {
        els.thresholdVal.textContent = els.threshold.value;
    });
    
    els.progressCancelBtn.addEventListener('click', () => {
        state.abortSearch = true;
    });
    
    els.previewClose.addEventListener('click', closePreview);
    els.previewModal.addEventListener('click', (e) => {
        if (e.target.id === 'previewModal') {
            closePreview();
        }
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && els.previewModal.classList.contains('show')) {
            closePreview();
        }
    });
    
    els.contextMenu.addEventListener('click', (e) => {
        const item = e.target.closest('.context-item');
        if (item) handleContextAction(item.dataset.action);
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('#contextMenu')) hideContextMenu();
    });
    document.addEventListener('scroll', (e) => {
        if (!e.target.closest('#contextMenu')) hideContextMenu();
    }, true);
    
    els.candidateClose.addEventListener('click', hideCandidatePanel);
    els.candidateCancel.addEventListener('click', hideCandidatePanel);
    els.candidateConfirm.addEventListener('click', confirmCandidate);
    
    window.addEventListener('resize', () => {
        if (state.currentTab === 'pending' || state.currentTab === 'ignored') {
            renderContent();
        }
    });
    
    document.addEventListener('paste', (e) => {
        if (document.activeElement === els.searchInput) return;
        const text = (e.clipboardData || window.clipboardData).getData('text');
        if (text && text.length > 0 && state.searchResults.length === 0) {
            els.searchInput.value = text.trim();
            performSearch();
        }
    });
}

/* ================================================
 *  启动
 * ================================================ */
bindEvents();

(async () => {
    await loadState();
    if (state.entries.length > 0) {
        els.dropzone.style.display = 'none';
        els.contentArea.style.display = 'block';
        els.exportBtn.disabled = false;
        els.exportProgressBtn.disabled = false;
        els.resetBtn.disabled = false;
        els.openZipBtn.textContent = '📁 更换压缩包';
        renderAll();
    }
})();
</script>
</body>
