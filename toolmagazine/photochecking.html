<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片查重管理工具 Pro v3.1</title>
<style>
:root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface-hover: #22223a;
    --surface-light: #252540;
    --border: #2a2a40;
    --border-light: #3a3a55;
    --accent: #4a9eff;
    --accent-hover: #6ab4ff;
    --accent-glow: rgba(74, 158, 255, 0.3);
    --text: #e0e0e0;
    --text-secondary: #888;
    --text-muted: #555;
    --danger: #ff6b6b;
    --success: #51cf66;
    --warning: #ffb84d;
    --shadow: 0 4px 20px rgba(0,0,0,0.4);
    --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ============ 顶部工具栏 ============ */
.topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.brand {
    font-weight: 700;
    font-size: 16px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
}
.btn {
    background: var(--surface-light);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    white-space: nowrap;
}
.btn:hover { background: var(--border); border-color: var(--border-light); }
.btn.accent { background: var(--accent); color: #fff; border-color: transparent; }
.btn.accent:hover { background: var(--accent-hover); }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
input[type="file"] { display: none; }

.search-box {
    flex: 1;
    min-width: 300px;
    max-width: 500px;
    position: relative;
}
.search-box input {
    width: 100%;
    padding: 8px 14px;
    background: var(--surface-light);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 13px;
    transition: all 0.15s;
}
.search-box input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-mode {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 2px;
}
.search-mode button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.15s;
}
.search-mode button:hover { color: var(--text-secondary); }
.search-mode button.active {
    background: var(--accent);
    color: #fff;
}

.threshold-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
}
.threshold-control input[type="range"] {
    width: 100px;
    accent-color: var(--accent);
}

/* ============ 标签页导航 ============ */
.tabs {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 4px;
}
.tab {
    padding: 10px 16px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 13px;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.tab:hover { color: var(--text); }
.tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}
.tab .count {
    background: var(--border);
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
}
.tab.active .count {
    background: var(--accent);
    color: #fff;
}
.tab-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
    padding-right: 8px;
}

/* ============ 主内容区 ============ */
.main {
    flex: 1;
    overflow: hidden;
    position: relative;
}
.content {
    height: 100%;
    overflow-y: auto;
    padding: 16px;
}
.content::-webkit-scrollbar { width: 8px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

/* ============ 图片网格 ============ */
.grid-container {
    position: relative;
    width: 100%;
}
.grid-spacer {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: -1;
}
.grid-content {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
}
.image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
}
.image-card {
    background: var(--surface-light);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    aspect-ratio: 1;
}
.image-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}
.image-card.selected {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
}
.image-card.multi-selected {
    outline: 2px solid var(--success);
    outline-offset: -2px;
}
.image-card.dragging {
    opacity: 0.5;
}
.image-card.drop-target {
    outline: 2px dashed var(--accent);
    outline-offset: -2px;
}
.image-card .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #111;
    display: block;
}
.image-card .filename {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 4px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    font-size: 11px;
    color: #fff;
    word-break: break-all;
    line-height: 1.3;
    max-height: 3.6em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.image-card .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
}
.image-card .badge.duplicate { background: var(--warning); color: #000; }
.image-card .badge.unique { background: var(--danger); color: #fff; }
.image-card .check-overlay {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 20px;
    height: 20px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
    transition: all 0.15s;
}
.image-card.multi-mode .check-overlay { display: flex; }
.image-card.multi-selected .check-overlay {
    background: var(--success);
    border-color: var(--success);
}
.image-card .base-thumb {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 36px;
    height: 36px;
    border: 2px solid var(--accent);
    border-radius: 6px;
    object-fit: cover;
    background: #111;
}

/* ============ 文件夹分组 ============ */
.folder-group {
    margin-bottom: 16px;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
}
.folder-header {
    padding: 10px 14px;
    background: var(--surface-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
    transition: background 0.15s;
}
.folder-header:hover { background: var(--border); }
.folder-header .expand-icon {
    font-size: 10px;
    transition: transform 0.2s;
    color: var(--text-secondary);
}
.folder-group.collapsed .expand-icon { transform: rotate(-90deg); }
.folder-group.collapsed .folder-body { display: none; }
.folder-header .folder-title {
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.folder-header .folder-title input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    width: 100%;
}
.folder-header .folder-title input:focus {
    border-color: var(--accent);
    outline: none;
    background: var(--bg);
}
.folder-header .folder-count {
    font-size: 12px;
    color: var(--text-secondary);
}
.folder-header .folder-actions {
    display: flex;
    gap: 2px;
}
.folder-header .folder-actions button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s;
}
.folder-header .folder-actions button:hover {
    background: var(--danger);
    color: #fff;
}
.folder-body {
    padding: 10px;
}

/* ============ 拖拽指示 ============ */
.drop-indicator {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
    z-index: 1000;
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* ============ 空状态 ============ */
.empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-secondary);
}
.empty-state .icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.5;
}
.empty-state .text {
    font-size: 14px;
    margin-bottom: 8px;
}
.empty-state .hint {
    font-size: 12px;
    color: var(--text-muted);
}

/* ============ 拖拽区 ============ */
.dropzone {
    position: absolute;
    inset: 0;
    margin: 16px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: var(--text-secondary);
    transition: all 0.2s;
    z-index: 10;
}
.dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(74, 158, 255, 0.1);
}
.dropzone .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.6;
}
.dropzone .text {
    font-size: 16px;
    margin-bottom: 8px;
}
.dropzone .hint {
    font-size: 12px;
    color: var(--text-muted);
}

/* ============ 进度条 ============ */
.progress-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}
.progress-overlay.active { display: flex; }
.progress-card {
    background: var(--surface);
    padding: 24px 32px;
    border-radius: 12px;
    min-width: 360px;
    text-align: center;
}
.progress-card h3 {
    font-size: 16px;
    margin-bottom: 16px;
    color: var(--text);
}
.progress-bar-wrap {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 12px;
}
.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    transition: width 0.3s;
}
.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-secondary);
}
.progress-cancel {
    margin-top: 16px;
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
}
.progress-cancel:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============ 右键菜单 ============ */
.context-menu {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    z-index: 2000;
    display: none;
    min-width: 160px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.context-menu.show { display: block; }
.context-item {
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
}
.context-item:hover { background: var(--border); }
.context-item.danger { color: var(--danger); }
.context-divider {
    height: 1px;
    background: var(--border);
    margin: 6px;
}

/* ============ 预览模态 ============ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1500;
    animation: fadeIn 0.2s;
}
.modal-overlay.show { display: flex; }
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
.modal-overlay img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
}
.modal-close {
    position: absolute;
    top: 20px;
    right: 24px;
    color: #fff;
    font-size: 32px;
    cursor: pointer;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: all 0.15s;
}
.modal-close:hover { background: rgba(255,255,255,0.2); }

/* ============ 候选面板 ============ */
.candidate-panel {
    position: fixed;
    right: 20px;
    top: 80px;
    width: 380px;
    max-height: calc(100vh - 120px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    z-index: 500;
    display: none;
    flex-direction: column;
    box-shadow: var(--shadow);
    animation: slideIn 0.2s;
}
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
.candidate-panel.show { display: flex; }
.candidate-header {
    padding: 12px 14px;
    background: var(--surface-light);
    border-radius: 12px 12px 0 0;
    font-weight: 600;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}
.candidate-header .close {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 18px;
    padding: 2px 6px;
    border-radius: 4px;
}
.candidate-header .close:hover { background: var(--danger); color: #fff; }
.candidate-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}
.candidate-list::-webkit-scrollbar { width: 6px; }
.candidate-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.candidate-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 6px;
}
.candidate-item:hover { background: var(--border); }
.candidate-item.current {
    outline: 2px solid var(--accent);
    background: rgba(74, 158, 255, 0.1);
}
.candidate-item .thumb {
    width: 48px;
    height: 36px;
    object-fit: cover;
    border-radius: 4px;
    background: #111;
    flex-shrink: 0;
}
.candidate-item .fname {
    flex: 1;
    font-size: 12px;
    word-break: break-all;
    line-height: 1.4;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.candidate-item input[type="checkbox"],
.candidate-item input[type="radio"] {
    accent-color: var(--accent);
    width: 18px;
    height: 18px;
    cursor: pointer;
    flex-shrink: 0;
}
.candidate-steps {
    display: flex;
    padding: 8px 10px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
}
.candidate-steps .step {
    flex: 1;
    text-align: center;
    padding: 4px 8px;
    font-size: 11px;
    border-radius: 4px;
    background: var(--bg-secondary);
    color: var(--text-muted);
    transition: all 0.2s;
}
.candidate-steps .step.active {
    background: var(--accent);
    color: #fff;
}
.candidate-steps .step.done {
    background: var(--success, #22c55e);
    color: #fff;
}
.base-group-select {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border-bottom: 1px solid var(--border);
}
.base-group-select select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-input);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
}
.base-group-select select:focus {
    outline: none;
    border-color: var(--accent);
}
.base-group-select .btn-new-group {
    width: 100%;
    padding: 8px;
    background: var(--bg-secondary);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
}
.base-group-select .btn-new-group:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}
.candidate-footer {
    padding: 10px;
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--border);
}
.candidate-footer button {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
}
.candidate-footer .confirm {
    background: var(--accent);
    color: #fff;
}
.candidate-footer .confirm:hover { background: var(--accent-hover); }
.candidate-footer .cancel {
    background: var(--border);
    color: var(--text);
}
.candidate-footer .cancel:hover { background: var(--border-light); }

/* ============ 批量操作栏 ============ */
.batch-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 400;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.batch-bar.show { transform: translateX(-50%) translateY(0); }
.batch-bar .batch-info {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
}
.batch-bar .batch-count {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 600;
}
.batch-bar button {
    background: var(--surface-light);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
}
.batch-bar button:hover { background: var(--border); }
.batch-bar .btn-ignore:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
.batch-bar .btn-restore { background: var(--success, #22c55e); border-color: var(--success, #22c55e); color: #fff; }
.batch-bar .btn-restore:hover { background: #16a34a; border-color: #16a34a; }
.batch-bar .btn-cancel:hover { background: var(--border-light); }

/* ============ 动画 ============ */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.fade-in { animation: fadeInUp 0.3s ease; }

.spinning {
    animation: spin 1s linear infinite;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* ============ 响应式 ============ */
@media (max-width: 768px) {
    .topbar { padding: 8px 12px; gap: 8px; }
    .brand { display: none; }
    .search-box { min-width: 0; }
    .tabs { overflow-x: auto; }
    .content { padding: 12px; }
    .image-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
}

/* ============ 基准组悬浮窗 ============ */
.base-float-window {
    position: fixed;
    right: 0;
    top: 60px;
    width: 280px;
    max-height: calc(100vh - 120px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px 0 0 12px;
    z-index: 600;
    display: none;
    flex-direction: column;
    box-shadow: -4px 0 20px rgba(0,0,0,0.3);
    animation: slideInRight 0.2s;
}
@keyframes slideInRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
}
.base-float-window.show { display: flex; }
.base-float-header {
    padding: 10px 12px;
    background: var(--surface-light);
    border-radius: 12px 0 0 0;
    font-weight: 600;
    font-size: 13px;

{

<script type="module">
import { ZipReader, ZipWriter, BlobReader, BlobWriter } from '@zip.js/zip.js';

/* ================================================
 *  全局状态
 * ================================================ */
const state = {
    zipReader: null,
    entries: [],
    entryMap: new Map(),
    imageHashMap: new Map(),
    ocrTextMap: new Map(),
    imageFeatureMap: new Map(),
    invertedIndex: new Map(),
    statusMap: new Map(),
    duplicateGroups: new Map(),
    baseGroups: new Map(),
    currentTab: 'pending',
    currentCandidateBase: null,
    candidateList: [],
    selectedCandidate: new Set(),
    candidateStep: 1,
    candidateSelectedBase: null,
    candidateSelectedGroup: null,
    multiSelectMode: false,
    selectedFiles: new Set(),
    dragSource: null,
    dragSourceArea: null,
    dropTarget: null,
    // WeChat-style multi-select drag
    multiSelectDragging: false,
    multiSelectDragStartX: 0,
    multiSelectDragStartY: 0,
    multiSelectDragTimer: null,
    // Floating base group window for drag-to-base
    showBaseFloat: false,
    baseFloatScrollDir: 0,
    baseFloatScrollTimer: null,
    zipFileName: '',
    zipFileSize: 0,
    isProcessing: false,
    searchMode: 'fuzzy',
    isSearching: false,
    abortSearch: false,
    searchResults: [],
    collapsedFolders: new Set(),
};

const CONFIG = {
    THUMB_WIDTH: 200,
    MAX_WORKERS: 12,
    MAX_OCR_CONCURRENT: 5,
    MAX_FEATURE_CONCURRENT: 3,
    MAX_PENDING_TASKS: 200,
    VIRTUAL_BUFFER: 5,
    THRESHOLD_DEFAULT: 8,
    PYRAMID_LEVELS: [0, 1.2, 2.5, 5.0],
    PYRAMID_WEIGHTS: [0.1, 0.2, 0.3, 0.4],
    MAX_EDGE_DISTANCE: 2,
    MAX_IMAGE_SIZE: 512,
    TOOL_VERSION: '3.1.0',
};

const thumbCache = new Map();
const MAX_THUMB_CACHE = 500;
const thumbLRU = [];
let ocrWorker = null;
let ocrWorkerReady = false;

/* ================================================
 *  IndexedDB 持久化
 * ================================================ */
const DB_NAME = 'DupFinderProV3', STORE_NAME = 'images';

function promisifyRequest(request) {
    return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 3);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'filename' });
            }
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
    });
}

async function saveState() {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        await promisifyRequest(store.clear());
        
        const allData = [];
        for (const [fname, hash] of state.imageHashMap) {
            const features = state.imageFeatureMap.get(fname);
            const fingerprint = features ? computeVisualFingerprint(features) : '';
            allData.push({
                filename: fname,
                hash,
                fingerprint,
                status: state.statusMap.get(fname) || 'pending',
                ocrText: state.ocrTextMap.get(fname) || ''
            });
        }
        for (const item of allData) {
            await promisifyRequest(store.put(item));
        }
        
        store.put({
            filename: '__groups__',
            dupGroups: [...state.duplicateGroups],
            baseGroups: [...state.baseGroups]
        });
        store.put({
            filename: '__meta__',
            fileName: state.zipFileName,
            fileSize: state.zipFileSize,
            version: CONFIG.TOOL_VERSION
        });
        
        await new Promise(resolve => { tx.oncomplete = () => { db.close(); resolve(); }; });
    } catch (e) {
        console.error('保存状态失败:', e);
    }
}

async function loadState() {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const all = await promisifyRequest(tx.objectStore(STORE_NAME).getAll());
        await new Promise(resolve => { tx.oncomplete = () => { db.close(); resolve(); }; });
        
        state.imageHashMap.clear();
        state.ocrTextMap.clear();
        state.imageFeatureMap.clear();
        state.invertedIndex.clear();
        state.statusMap.clear();
        state.duplicateGroups.clear();
        state.baseGroups.clear();
        
        for (const item of all) {
            if (item.filename === '__groups__') {
                state.duplicateGroups = new Map(item.dupGroups || []);
                state.baseGroups = new Map(item.baseGroups || []);
            } else if (item.filename === '__meta__') {
                state.zipFileName = item.fileName || '';
                state.zipFileSize = item.fileSize || 0;
            } else {
                state.imageHashMap.set(item.filename, item.hash);
                state.statusMap.set(item.filename, item.status || 'pending');
                if (item.ocrText) state.ocrTextMap.set(item.filename, item.ocrText);
                if (item.fingerprint) {
                    state.imageFeatureMap.set(item.filename, {
                        fingerprint: item.fingerprint,
                        fullFeatures: null
                    });
                }
            }
        }
    } catch (e) {
        console.error('加载状态失败:', e);
    }
}

/* ================================================
 *  Worker 哈希计算
 * ================================================ */
const workerBlob = new Blob([`
self.onmessage = async function(e) {
    try {
        const { blob, index, filename } = e.data;
        
        if (filename && /\.(jpg|jpeg|png|webp|bmp|gif|tiff?)$/i.test(filename) === false) {
            self.postMessage({ index, hash: 'non-image' });
            return;
        }
        
        let img;
        try {
            img = await createImageBitmap(blob, {
                resizeWidth: 9,
                resizeHeight: 8,
                resizeQuality: 'pixelated'
            });
        } catch (e1) {
            try {
                img = await createImageBitmap(blob);
            } catch (e2) {
                self.postMessage({ index, hash: 'error-decode:' + (e2.message || 'unknown').substring(0, 30) });
                return;
            }
        }
        
        const c = new OffscreenCanvas(9, 8);
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, 9, 8);
        
        const d = ctx.getImageData(0, 0, 9, 8).data;
        let h = 0n;
        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
                const i = (y * 9 + x) * 4;
                const j = i + 4;
                const g = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                const g2 = d[j] * 0.299 + d[j+1] * 0.587 + d[j+2] * 0.114;
                h <<= 1n;
                if (g > g2) h |= 1n;
            }
        }
        img.close();
        self.postMessage({ index, hash: h.toString(16).padStart(16, '0') });
    } catch (err) {
        self.postMessage({ index, hash: 'error:' + (err.message || 'unknown').substring(0, 50) });
    }
}
`], { type: 'application/javascript' });

const workerUrl = URL.createObjectURL(workerBlob);
let workers = [];
let workerBusy = [];
let totalImages = 0;
let processedCount = 0;
let activeTasks = 0;

function initWorkers() {
    destroyAllWorkers();
    workers = [];
    workerBusy = new Array(CONFIG.MAX_WORKERS).fill(false);
    for (let i = 0; i < CONFIG.MAX_WORKERS; i++) {
        const w = new Worker(workerUrl);
        w.onmessage = (e) => {
            workerBusy[i] = false;
            activeTasks--;
            const { index, hash, error } = e.data;
            if (!error) {
                state.imageHashMap.set(state.entries[index].filename, hash);
            }
            processedCount++;
            updateProgressUI();
        };
        workers.push(w);
    }
}

function destroyAllWorkers() {
    workers.forEach(w => w.terminate());
    workers = [];
    workerBusy = [];
    activeTasks = 0;
    if (workerUrl) {
        URL.revokeObjectURL(workerUrl);
    }
}

async function processImageInWorker(blob, index, filename) {
    return new Promise((resolve) => {
        const trySend = () => {
            const freeIdx = workerBusy.findIndex(b => !b);
            if (freeIdx === -1) {
                setTimeout(trySend, 10);
                return;
            }
            workerBusy[freeIdx] = true;
            activeTasks++;
            
            let done = false;
            const timeoutId = setTimeout(() => {
                if (done) return;
                done = true;
                workers[freeIdx].removeEventListener('message', handler);
                workerBusy[freeIdx] = false;
                activeTasks--;
                processedCount++;
                resolve();
            }, 15000);
            
            const handler = (e) => {
                if (e.data.index !== index) return;
                if (done) return;
                done = true;
                clearTimeout(timeoutId);
                workers[freeIdx].removeEventListener('message', handler);
                workerBusy[freeIdx] = false;
                activeTasks--;
                const { hash } = e.data;
                if (hash && !hash.startsWith('error-') && hash !== 'non-image') {
                    state.imageHashMap.set(state.entries[index].filename, hash);
                }
                processedCount++;
                resolve();
            };
            
            workers[freeIdx].addEventListener('message', handler);
            try {
                workers[freeIdx].postMessage({ blob, index, filename });
            } catch (err) {
                if (done) return;
                done = true;
                clearTimeout(timeoutId);
                workerBusy[freeIdx] = false;
                activeTasks--;
                processedCount++;
                resolve();
            }
        };
        trySend();
    });
}

async function waitForWorkerSlot() {
    return new Promise((resolve) => {
        const check = () => {
            if (activeTasks < CONFIG.MAX_PENDING_TASKS) {
                resolve();
            } else {
                setTimeout(check, 30);
            }
        };
        check();
    });
}

/* ================================================
 *  OCR 引擎
 * ================================================ */
async function initOcrWorker() {
    if (ocrWorker && ocrWorkerReady) return ocrWorker;
    
    try {
        ocrWorker = await Tesseract.createWorker('chi_sim+eng', 2, {
            logger: () => {},
            gzip: true,
            langPath: 'https://tessdata.projectnaptha.com/4.0.0'
        });
        await ocrWorker.setParameters({
            tessedit_pageseg_mode: Tesseract.PSM.AUTO,
            preserve_interword_spaces: '1',
        });
        ocrWorkerReady = true;
        return ocrWorker;
    } catch (e) {
        try {
            ocrWorker = await Tesseract.createWorker('eng', 2, {
                logger: () => {},
                gzip: true
            });
            ocrWorkerReady = true;
            return ocrWorker;
        } catch (e2) {
            console.error('OCR 初始化失败:', e2);
            ocrWorker = null;
            ocrWorkerReady = false;
            return null;
        }
    }
}

async function preprocessForOcr(blob) {
    return new Promise((resolve) => {
        const img = new Image();
        const tempUrl = URL.createObjectURL(blob);
        img.onload = () => {
            const maxSize = 1600;
            let w = img.width, h = img.height;
            const ratio = maxSize / Math.max(w, h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const imageData = ctx.getImageData(0, 0, w, h);
            const d = imageData.data;
            for (let i = 0; i < d.length; i += 4) {
                const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
                d[i] = d[i+1] = d[i+2] = gray;
            }
            ctx.putImageData(imageData, 0, 0);
            canvas.toBlob((result) => {
                URL.revokeObjectURL(tempUrl);
                resolve(result);
            }, 'image/jpeg', 0.92);
        };
        img.onerror = () => {
            URL.revokeObjectURL(tempUrl);
            resolve(blob);
        };
        img.src = tempUrl;
    });
}

/* ================================================
 *  缩略图系统
 * ================================================ */
const thumbLoadPromises = new Map();

const lazyObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const img = entry.target;
            const filename = img.dataset.filename;
            if (filename && !img.src && !img.dataset.loading) {
                img.dataset.loading = 'true';
                loadThumbnail(filename).then(url => {
                    if (!url) return;
                    const allImgs = document.querySelectorAll(`img.thumb[data-filename="${filename}"]`);
                    allImgs.forEach(el => {
                        if (!el.src) {
                            el.src = url;
                            el.removeAttribute('data-loading');
                            if (el.decode) el.decode().catch(() => {});
                        }
                    });
                });
            }
            lazyObserver.unobserve(img);
        }
    });
}, { rootMargin: '600px', threshold: 0 });

function revokeThumbURL(filename) {
    const url = thumbCache.get(filename);
    if (url) {
        URL.revokeObjectURL(url);
        thumbCache.delete(filename);
        const idx = thumbLRU.indexOf(filename);
        if (idx !== -1) thumbLRU.splice(idx, 1);
    }
}

function clearThumbCache() {
    for (const [filename, url] of thumbCache) {
        URL.revokeObjectURL(url);
    }
    thumbCache.clear();
    thumbLRU.length = 0;
    thumbLoadPromises.clear();
    revokeAllOriginalUrls();
}

function addToThumbCache(filename, url) {
    if (thumbCache.has(filename)) {
        const idx = thumbLRU.indexOf(filename);
        if (idx !== -1) thumbLRU.splice(idx, 1);
    } else {
        thumbLRU.push(filename);
    }
    thumbCache.set(filename, url);
    
    while (thumbLRU.length > MAX_THUMB_CACHE) {
        const oldest = thumbLRU.shift();
        if (oldest) revokeThumbURL(oldest);
    }
}

async function loadThumbnail(filename) {
    if (thumbCache.has(filename)) {
        const url = thumbCache.get(filename);
        const idx = thumbLRU.indexOf(filename);
        if (idx !== -1) {
            thumbLRU.splice(idx, 1);
            thumbLRU.push(filename);
        }
        return url;
    }
    
    if (thumbLoadPromises.has(filename)) {
        return thumbLoadPromises.get(filename);
    }
    
    const promise = _loadThumbnailInternal(filename);
    thumbLoadPromises.set(filename, promise);
    promise.finally(() => thumbLoadPromises.delete(filename));
    return promise;
}

async function _loadThumbnailInternal(filename) {
    const entry = state.entryMap.get(filename);
    if (!entry) return null;
    try {
        const blob = await entry.getData(new BlobWriter());
        
        let bitmap;
        try {
            bitmap = await createImageBitmap(blob, {
                resizeWidth: CONFIG.THUMB_WIDTH,
                resizeQuality: 'medium'
            });
        } catch (e) {
            bitmap = await createImageBitmap(blob, { colorSpaceConversion: 'none' });
            const ratio = bitmap.height / bitmap.width;
            const thumbH = Math.round(CONFIG.THUMB_WIDTH * ratio);
            const canvas = new OffscreenCanvas(CONFIG.THUMB_WIDTH, thumbH);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0, CONFIG.THUMB_WIDTH, thumbH);
            bitmap.close();
            bitmap = canvas.transferToImageBitmap();
        }
        
        const canvas = new OffscreenCanvas(bitmap.width, bitmap.height);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0);
        bitmap.close();
        
        const thumbBlob = await canvas.convertToBlob({ type: 'image/webp', quality: 0.75 });
        const url = URL.createObjectURL(thumbBlob);
        addToThumbCache(filename, url);
        return url;
    } catch (e) {
        try {
            const blob = await entry.getData(new BlobWriter());
            const url = URL.createObjectURL(blob);
            addToThumbCache(filename, url);
            return url;
        } catch (e2) {
            return null;
        }
    }
}

const originalUrls = new Map();

async function loadOriginal(filename) {
    // 复用已有URL，避免revoke正在使用的URL
    if (originalUrls.has(filename)) {
        return originalUrls.get(filename);
    }
    const entry = state.entryMap.get(filename);
    if (!entry) return null;
    const blob = await entry.getData(new BlobWriter());
    const url = URL.createObjectURL(blob);
    originalUrls.set(filename, url);
    return url;
}

function revokeAllOriginalUrls() {
    for (const [, url] of originalUrls) {
        URL.revokeObjectURL(url);
    }
    originalUrls.clear();
}

/* ================================================
 *  工具函数
 * ================================================ */
function hammingDistance(h1, h2) {
    let d = 0;
    for (let i = 0; i < h1.length; i++) {
        const xor = parseInt(h1[i], 16) ^ parseInt(h2[i], 16);
        let x = xor;
        while (x) { d += x & 1; x >>= 1; }
    }
    return d;
}

/* ================================================
 *  视觉特征提取 - 多级模糊金字塔
 * ================================================ */
async function extractVisualFeatures(blob) {
    const bitmap = await createImageBitmap(blob);
    const maxSize = CONFIG.MAX_IMAGE_SIZE;
    let w = bitmap.width, h = bitmap.height;
    const scale = Math.min(1, maxSize / Math.max(w, h));
    w = Math.round(w * scale);
    h = Math.round(h * scale);
    
    const features = [];
    
    for (let level = 0; level < CONFIG.PYRAMID_LEVELS.length; level++) {
        const sigma = CONFIG.PYRAMID_LEVELS[level];
        const canvas = new OffscreenCanvas(w, h);
        const ctx = canvas.getContext('2d');
        
        if (sigma === 0) {
            ctx.drawImage(bitmap, 0, 0, w, h);
        } else {
            const tempCanvas = new OffscreenCanvas(w, h);
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(bitmap, 0, 0, w, h);
            
            const blurCanvas = new OffscreenCanvas(w, h);
            const blurCtx = blurCanvas.getContext('2d');
            blurCtx.filter = `blur(${sigma}px)`;
            blurCtx.drawImage(tempCanvas, 0, 0);
            blurCtx.filter = 'none';
            
            ctx.drawImage(blurCanvas, 0, 0);
        }
        
        const imageData = ctx.getImageData(0, 0, w, h);
        const colorHist = extractColorHistogram(imageData, w, h);
        const lbpHist = extractLBP(imageData, w, h);
        const levelHash = computeLevelHash(imageData, w, h);
        
        features.push({
            color: colorHist,
            lbp: lbpHist,
            hash: levelHash,
            level: level
        });
    }
    
    bitmap.close();
    return features;
}

function computeLevelHash(imageData, w, h) {
    const smallCanvas = new OffscreenCanvas(16, 16);
    const ctx = smallCanvas.getContext('2d');
    ctx.drawImage(imageData, 0, 0, 16, 16);
    const smallData = ctx.getImageData(0, 0, 16, 16).data;
    
    const gray = [];
    for (let i = 0; i < 256; i++) {
        gray.push(0.299 * smallData[i*4] + 0.587 * smallData[i*4+1] + 0.114 * smallData[i*4+2]);
    }
    
    let hash = '';
    for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
            const idx = i * 2 * 16 + j * 2;
            const avg = (gray[idx] + gray[idx+1] + gray[idx+16] + gray[idx+17]) / 4;
            if (avg > 128) hash += '1';
            else hash += '0';
        }
    }
    
    return BigInt('0b' + hash).toString(16).padStart(16, '0');
}

function computeVisualFingerprint(features) {
    const hashes = features.map(f => f.hash);
    let fingerprint = '';
    for (const h of hashes) {
        fingerprint += h;
    }
    return fingerprint;
}

function extractColorHistogram(imageData, w, h) {
    const data = imageData.data;
    const histSize = 11 * 8 * 8;
    const hist = new Float32Array(histSize);
    const hBins = 11, sBins = 8, vBins = 8;
    
    for (let i = 0; i < w * h; i++) {
        const r = data[i * 4] / 255;
        const g = data[i * 4 + 1] / 255;
        const b = data[i * 4 + 2] / 255;
        
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const d = max - min;
        
        let hVal = 0;
        if (d !== 0) {
            if (max === r) hVal = ((g - b) / d) % 6;
            else if (max === g) hVal = (b - r) / d + 2;
            else hVal = (r - g) / d + 4;
            hVal *= 60;
            if (hVal < 0) hVal += 360;
        }
        const sVal = max === 0 ? 0 : d / max;
        const vVal = max;
        
        const hBin = Math.min(Math.floor(hVal / (360 / hBins)), hBins - 1);
        const sBin = Math.min(Math.floor(sVal * sBins), sBins - 1);
        const vBin = Math.min(Math.floor(vVal * vBins), vBins - 1);
        
        hist[hBin * sBins * vBins + sBin * vBins + vBin]++;
    }
    
    const total = w * h;
    for (let i = 0; i < histSize; i++) hist[i] /= total;
    
    return hist;
}

function extractLBP(imageData, w, h) {
    const data = imageData.data;
    const hist = new Float32Array(59);
    
    const gray = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) {
        gray[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
    }
    
    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            const center = gray[y * w + x];
            let code = 0;
            const neighbors = [
                gray[(y-1) * w + (x-1)], gray[(y-1) * w + x], gray[(y-1) * w + (x+1)],
                gray[y * w + (x+1)], gray[(y+1) * w + (x+1)],
                gray[(y+1) * w + x], gray[(y+1) * w + (x-1)], gray[y * w + (x-1)]
            ];
            
            for (let i = 0; i < 8; i++) {
                if (neighbors[i] >= center) code |= (1 << i);
            }
            
            let transitions = 0;
            let ones = 0;
            for (let i = 0; i < 8; i++) {
                if (((code >> i) & 1) !== ((code >> ((i + 1) % 8)) & 1)) transitions++;
                if ((code >> i) & 1) ones++;
            }
            
            let uniformBin;
            if (transitions <= 2) {
                if (ones === 0) uniformBin = 0;
                else if (ones === 1) uniformBin = 1;
                else if (ones === 2) uniformBin = 2;
                else if (ones === 3) uniformBin = 3;
                else uniformBin = 4 + ones;
            } else {
                uniformBin = 9;
            }
            hist[uniformBin]++;
        }
    }
    
    const validPixels = (w - 2) * (h - 2);
    if (validPixels > 0) {
        for (let i = 0; i < 59; i++) hist[i] /= validPixels;
    }
    
    return hist;
}

function cosineSimilarity(v1, v2) {
    let dot = 0, norm1 = 0, norm2 = 0;
    for (let i = 0; i < v1.length; i++) {
        dot += v1[i] * v2[i];
        norm1 += v1[i] * v1[i];
        norm2 += v2[i] * v2[i];
    }
    if (norm1 === 0 || norm2 === 0) return 0;
    return dot / (Math.sqrt(norm1) * Math.sqrt(norm2));
}

function computeVisualSimilarity(features1, features2) {
    const hashDistances = [];
    for (let level = 0; level < features1.length; level++) {
        const h1 = features1[level].hash;
        const h2 = features2[level].hash;
        const dist = hammingDistance(h1, h2);
        hashDistances.push(dist);
    }
    
    const avgHashDist = hashDistances.reduce((a, b) => a + b, 0) / hashDistances.length;
    if (avgHashDist > 20) return 0;
    
    let totalSim = 0;
    for (let level = 0; level < features1.length; level++) {
        const f1 = features1[level];
        const f2 = features2[level];
        
        const colorSim = cosineSimilarity(f1.color, f2.color);
        const lbpSim = cosineSimilarity(f1.lbp, f2.lbp);
        const hashSim = 1 - (hashDistances[level] / 64);
        const levelSim = colorSim * 0.4 + lbpSim * 0.3 + hashSim * 0.3;
        
        totalSim += CONFIG.PYRAMID_WEIGHTS[level] * levelSim;
    }
    
    return totalSim;
}

/* ================================================
 *  OCR 倒排索引
 * ================================================ */
function buildInvertedIndex() {
    state.invertedIndex.clear();
    
    for (const [filename, text] of state.ocrTextMap) {
        if (!text) continue;
        const words = tokenizeText(text);
        for (const word of words) {
            if (!state.invertedIndex.has(word)) {
                state.invertedIndex.set(word, new Set());
            }
            state.invertedIndex.get(word).add(filename);
        }
    }
}

function tokenizeText(text) {
    const cleaned = text
        .replace(/[\u4e00-\u9fa5]/g, ' $& ')
        .replace(/[^a-zA-Z0-9\u4e00-\u9fa5\s]/g, ' ')
        .toLowerCase();
    
    const words = cleaned.split(/\s+/).filter(w => w.length > 0);
    
    const result = [];
    for (const word of words) {
        if (/[\u4e00-\u9fa5]/.test(word)) {
            for (let i = 0; i < word.length - 1; i++) {
                result.push(word.substring(i, i + 2));
            }
            result.push(word);
        } else {
            result.push(word);
            result.push(stemWord(word));
        }
    }
    
    return result.filter(w => w.length >= 1);
}

function stemWord(word) {
    const suffixes = ['ing', 'ed', 'tion', 'sion', 'ment', 'ness', 'able', 'ible', 'ful', 'less', 'ly'];
    for (const suffix of suffixes) {
        if (word.endsWith(suffix) && word.length > suffix.length + 2) {
            return word.substring(0, word.length - suffix.length);
        }
    }
    return word;
}

function editDistance(s1, s2) {
    const m = s1.length, n = s2.length;
    const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));
    
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    
    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            if (s1[i-1] === s2[j-1]) {
                dp[i][j] = dp[i-1][j-1];
            } else {
                dp[i][j] = 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
            }
        }
    }
    
    return dp[m][n];
}

function fuzzyMatchTerm(term, maxDistance) {
    const matches = [];
    for (const word of state.invertedIndex.keys()) {
        if (word === term) {
            matches.push({ word, distance: 0 });
        } else if (word.length >= term.length - maxDistance && word.length <= term.length + maxDistance) {
            const dist = editDistance(term, word);
            if (dist <= maxDistance) {
                matches.push({ word, distance: dist });
            }
        }
    }
    return matches.sort((a, b) => a.distance - b.distance);
}

function searchOcrIndex(query) {
    const tokens = tokenizeText(query);
    let candidateScores = new Map();
    
    for (const token of tokens) {
        const matches = fuzzyMatchTerm(token, CONFIG.MAX_EDGE_DISTANCE);
        
        for (const match of matches) {
            const files = state.invertedIndex.get(match.word);
            if (!files) continue;
            
            const weight = 1 / (match.distance + 1);
            for (const file of files) {
                if (!candidateScores.has(file)) {
                    candidateScores.set(file, 0);
                }
                candidateScores.set(file, candidateScores.get(file) + weight);
            }
        }
    }
    
    return [...candidateScores.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([file, score]) => file);
}

/* ================================================
 *  图片搜索 - 视觉相似度优化版
 * ================================================ */
async function computeAllVisualFeatures() {
    const pendingFiles = getFilesByStatus('pending');
    const uncachedFiles = pendingFiles.filter(f => {
        const entry = state.imageFeatureMap.get(f);
        return !entry || !entry.fullFeatures;
    });
    
    if (uncachedFiles.length === 0) return;
    
    showProgress('🎨 提取视觉特征中...', 0, `0 / ${uncachedFiles.length}`);
    
    let processed = 0;
    
    for (let i = 0; i < uncachedFiles.length && !state.abortSearch; i += CONFIG.MAX_FEATURE_CONCURRENT) {
        const batch = uncachedFiles.slice(i, Math.min(i + CONFIG.MAX_FEATURE_CONCURRENT, uncachedFiles.length));
        const promises = batch.map(async (filename) => {
            if (state.abortSearch) return;
            try {
                const entry = state.entryMap.get(filename);
                if (!entry) return;
                const blob = await entry.getData(new BlobWriter());
                if (state.abortSearch) return;
                const features = await extractVisualFeatures(blob);
                const fingerprint = computeVisualFingerprint(features);
                const existingEntry = state.imageFeatureMap.get(filename) || {};
                state.imageFeatureMap.set(filename, {
                    fingerprint: existingEntry.fingerprint || fingerprint,
                    fullFeatures: features
                });
            } catch (e) {
                console.error('特征提取失败:', filename, e);
            }
            processed++;
            showProgress('🎨 提取视觉特征中...', Math.round(processed / uncachedFiles.length * 100), `${processed} / ${uncachedFiles.length}`);
        });
        await Promise.all(promises);
    }
}

function findSimilarByVisual(baseFilename, threshold) {
    const baseEntry = state.imageFeatureMap.get(baseFilename);
    if (!baseEntry) return [];
    
    const pendingFiles = getFilesByStatus('pending');
    const candidates = [];
    
    for (const filename of pendingFiles) {
        if (filename === baseFilename) continue;
        const entry = state.imageFeatureMap.get(filename);
        if (!entry) continue;
        
        const similarity = computeFeatureSimilarity(baseEntry, entry);
        candidates.push({ filename, similarity });
    }
    
    candidates.sort((a, b) => b.similarity - a.similarity);
    
    const t = threshold ?? parseInt(document.getElementById('threshold').value);
    const thresholdNorm = 1 - (t / 32);
    
    return candidates
        .filter(c => c.similarity >= thresholdNorm && c.similarity < 0.99)
        .map(c => c.filename);
}

function computeFeatureSimilarity(entry1, entry2) {
    if (entry1.fullFeatures && entry2.fullFeatures) {
        return computeVisualSimilarity(entry1.fullFeatures, entry2.fullFeatures);
    }
    
    if (entry1.fingerprint && entry2.fingerprint) {
        return 1 - (hammingDistance(entry1.fingerprint, entry2.fingerprint) / (entry1.fingerprint.length * 4));
    }
    
    return 0;
}

/* ================================================
 *  兼容函数 - 保留原 hash 搜索作为快速模式
 * ================================================ */
function findSimilarByHash(baseFilename, threshold) {
    const hash = state.imageHashMap.get(baseFilename);
    if (!hash) return [];
    const t = threshold ?? parseInt(document.getElementById('threshold').value);
    const minDist = Math.floor(t * 0.15);
    const results = [];
    for (const [f, h] of state.imageHashMap) {
        if (f === baseFilename) continue;
        if (state.statusMap.get(f) !== 'pending') continue;
        const dist = hammingDistance(hash, h);
        if (dist <= t && dist >= minDist) results.push(f);
    }
    return results;
}

function getFilesByStatus(status) {
    const files = [];
    for (const [f, s] of state.statusMap) {
        if (s === status) files.push(f);
    }
    return files;
}

function getFilesForTab(tab) {
    switch (tab) {
        case 'pending': return getFilesByStatus('pending');
        case 'base': {
            const files = [];
            for (const [_, group] of state.baseGroups) {
                files.push(...group.images);
            }
            return files;
        }
        case 'dup': {
            const files = [];
            for (const [_, group] of state.duplicateGroups) {
                files.push(group.base, ...group.duplicates);
            }
            return files;
        }
        case 'ignored': return getFilesByStatus('unique');
        case 'search': return state.searchResults;
        default: return [];
    }
}

function getCurrentTabFiles() {
    return getFilesForTab(state.currentTab);
}

function createImageCard(filename, options = {}) {
    const card = document.createElement('div');
    card.className = 'image-card';
    card.dataset.filename = filename;
    if (state.multiSelectMode) card.classList.add('multi-mode');
    if (state.selectedFiles.has(filename)) card.classList.add('multi-selected');
    if (options.draggable !== false) card.draggable = true;
    
    const cached = thumbCache.get(filename);
    const status = state.statusMap.get(filename);
    
    const imgSrcAttr = cached ? `src="${cached}"` : '';
    card.innerHTML = `
        <div class="check-overlay">✓</div>
        <img class="thumb" data-filename="${filename}" ${imgSrcAttr} alt="${filename}">
        ${getStatusBadge(status)}
        <div class="filename" title="${filename}">${filename}</div>
    `;
    
    if (cached) {
        const idx = thumbLRU.indexOf(filename);
        if (idx !== -1) {
            thumbLRU.splice(idx, 1);
            thumbLRU.push(filename);
        }
    } else if (options.immediate) {
        const img = card.querySelector('.thumb');
        if (img) {
            const cachedUrl = thumbCache.get(filename);
            if (cachedUrl) {
                img.src = cachedUrl;
                img.removeAttribute('data-loading');
                if (img.decode) img.decode().catch(() => {});
            } else {
                img.dataset.loading = 'true';
                loadThumbnail(filename).then(url => {
                    if (!url) return;
                    const allImgs = document.querySelectorAll(`img.thumb[data-filename="${filename}"]`);
                    allImgs.forEach(el => {
                        if (!el.src) {
                            el.src = url;
                            el.removeAttribute('data-loading');
                            if (el.decode) el.decode().catch(() => {});
                        }
                    });
                });
            }
        }
    }
    
    card.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.multiSelectMode) {
            toggleFileSelection(filename);
        } else {
            previewImage(filename);
        }
    });
    
    card.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (state.multiSelectMode) {
            toggleFileSelection(filename);
        } else {
            showContextMenu(e, filename, options.area || state.currentTab);
        }
    });
    
    // WeChat-style multi-select drag: long press on ✓ overlay
    const checkOverlay = card.querySelector('.check-overlay');
    checkOverlay.addEventListener('mousedown', (e) => {
        if (!state.multiSelectMode) return;
        e.preventDefault();
        e.stopPropagation();
        state.multiSelectDragStartX = e.clientX;
        state.multiSelectDragStartY = e.clientY;
        state.multiSelectDragInitiator = filename;
        state.multiSelectDragTimer = setTimeout(() => {
            state.multiSelectDragging = true;
            toggleFileSelection(filename);
            els.multiDragIndicator.classList.add('show');
            els.multiDragCount.textContent = `已选 ${state.selectedFiles.size} 张`;
        }, 200);
    });
    
    card.addEventListener('dragstart', (e) => {
        // 微信式多选拖拽中不触发原生拖拽
        if (state.multiSelectDragging) { e.preventDefault(); return; }
        state.dragSource = filename;
        state.dragSourceArea = options.area || state.currentTab;
        e.dataTransfer.effectAllowed = 'move';
        try {
            e.dataTransfer.setData('text/plain', filename);
        } catch (err) {}
        card.classList.add('dragging');
        // 显示基准组悬浮窗
        showBaseFloatWindow();
    });
    
    card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        state.dragSource = null;
        state.dragSourceArea = null;
        document.querySelectorAll('.image-card.drop-target').forEach(el => el.classList.remove('drop-target'));
        document.querySelectorAll('.base-float-item.drop-hover').forEach(el => el.classList.remove('drop-hover'));
        hideBaseFloatWindow();
    });
    
    return card;
}

function renderVirtualGrid(container, files, area) {
    container.innerHTML = '';
    
    if (files.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="icon">📭</div>
                <div class="text">暂无图片</div>
            </div>
        `;
        return;
    }
    
    const columns = getGridColumns(container);
    const totalHeight = Math.ceil(files.length / columns) * VIRTUAL_ITEM_HEIGHT;
    
    const gridContainer = document.createElement('div');
    gridContainer.className = 'grid-container';
    gridContainer.style.height = totalHeight + 'px';
    
    const spacer = document.createElement('div');
    spacer.className = 'grid-spacer';
    spacer.style.height = totalHeight + 'px';
    
    const gridContent = document.createElement('div');
    gridContent.className = 'grid-content';
    gridContent.style.transform = 'translateY(0)';
    
    gridContainer.appendChild(spacer);
    gridContainer.appendChild(gridContent);
    container.appendChild(gridContainer);
    
    const renderChunk = () => {
        const cols = getGridColumns(container);
        const scrollTop = container.scrollTop;
        const viewportHeight = container.clientHeight;
        const chunkSize = Math.ceil(viewportHeight / VIRTUAL_ITEM_HEIGHT) + CONFIG.VIRTUAL_BUFFER * 2;
        const startRow = Math.max(0, Math.floor(scrollTop / VIRTUAL_ITEM_HEIGHT) - CONFIG.VIRTUAL_BUFFER);
        const endRow = Math.min(Math.ceil(files.length / cols), startRow + chunkSize);
        const startIdx = startRow * cols;
        const endIdx = Math.min(files.length, endRow * cols);
        
        gridContent.innerHTML = '';
        gridContent.style.transform = `translateY(${startRow * VIRTUAL_ITEM_HEIGHT}px)`;
        
        const grid = document.createElement('div');
        grid.className = 'image-grid';
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        
        for (let i = startIdx; i < endIdx; i++) {
            const card = createImageCard(files[i], { area, immediate: true });
            grid.appendChild(card);
        }
        
        gridContent.appendChild(grid);
        
        // 扫描未加载的缩略图并触发加载
        const missingThumbs = gridContent.querySelectorAll('img.thumb:not([src])');
        missingThumbs.forEach(img => {
            const fn = img.dataset.filename;
            if (!fn) return;
            // 清除旧的 loading 标记（可能从 innerHTML 继承）
            img.removeAttribute('data-loading');
            // 直接调用 loadThumbnail，Promise 缓存保证不会重复加载
            img.dataset.loading = 'true';
            loadThumbnail(fn).then(url => {
                if (!url) return;
                // 按 filename 查找当前 DOM 中所有匹配的 img
                const allImgs = document.querySelectorAll(`img.thumb[data-filename="${fn}"]`);
                allImgs.forEach(el => {
                    if (!el.src) {
                        el.src = url;
                        el.removeAttribute('data-loading');
                        if (el.decode) el.decode().catch(() => {});
                    }
                });
            });
        });
    };
    
    container._renderChunk = renderChunk;
    container._onVirtualScroll = () => {
        clearTimeout(container._scrollTimer);
        container._scrollTimer = setTimeout(renderChunk, 16);
    };
    
    renderChunk();
    container.removeEventListener('scroll', container._onVirtualScroll);
    container.addEventListener('scroll', container._onVirtualScroll);
}

    els.contentArea.scrollTop = 0;
    els.contentArea.innerHTML = '';
    
    updateTabActions();
    
    const tab = state.currentTab;
    const files = getCurrentTabFiles();
    
    if (tab === 'search') {
        renderSearchResults(files);
    } else if (tab === 'base') {
        renderBaseGroups();
    } else if (tab === 'dup') {
        renderDuplicateGroups();

    }
}
